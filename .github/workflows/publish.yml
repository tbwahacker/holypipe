name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Builds the Docker image and pushes it to GitHub Container Registry.
  # Runs on every push to main (tagged `edge`) and on version tags (tagged
  # with the version, plus `latest`). Uses the repo's own GITHUB_TOKEN —
  # nothing to configure, this works the moment the workflow lands on main.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Builds the sdist/wheel and publishes to PyPI. Only runs on a GitHub
  # Release being published (not every tag push, so a bad tag doesn't
  # accidentally ship). Requires a `PYPI_API_TOKEN` repository secret — an
  # API token generated at https://pypi.org/manage/account/ (or, once the
  # `holypipe` project exists on PyPI, a project-scoped token) added under
  # Settings → Secrets and variables → Actions. Without that secret this
  # job simply fails; it does not block the Docker publish above.
  pypi:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build
      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
